<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Snake Game</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #0f1420;
    color: #e6e9f0;
    font-family: system-ui, -apple-system, sans-serif;
  }
  h1 { margin: 0.2em 0; letter-spacing: 2px; }
  #score { margin-bottom: 10px; font-size: 1.1em; }
  canvas {
    background: #1a2032;
    border: 2px solid #3a4160;
    border-radius: 8px;
    box-shadow: 0 0 30px rgba(80, 120, 255, 0.15);
  }
  #overlay {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(10, 12, 20, 0.85);
    gap: 12px;
  }
  #overlay button {
    padding: 10px 24px;
    font-size: 1em;
    background: #4a7bff;
    color: white;
    border: none;
    border-radius: 6px;
    cursor: pointer;
  }
  #overlay button:hover { background: #3a63e0; }
  #hint { font-size: 0.85em; color: #8892b0; margin-top: 8px; }
</style>
</head>
<body>
  <h1>SNAKE</h1>
  <div id="score">Score: 0 &nbsp;|&nbsp; Best: 0</div>
  <canvas id="game" width="400" height="400"></canvas>
  <div id="hint">Arrow keys / WASD to move &middot; Space to pause</div>

  <div id="overlay">
    <div id="overlayText" style="font-size:1.5em;">Game Over</div>
    <button id="restartBtn">Play Again</button>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreEl = document.getElementById('score');
  const overlay = document.getElementById('overlay');
  const overlayText = document.getElementById('overlayText');
  const restartBtn = document.getElementById('restartBtn');

  const GRID = 20;
  const CELLS = canvas.width / GRID;
  const STORAGE_KEY = 'snake_best_score';

  let snake, dir, nextDir, food, score, best, running, paused, loopId;

  function loadBest() {
    try {
      return parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0;
    } catch (e) {
      return 0;
    }
  }

  function saveBest(value) {
    try {
      localStorage.setItem(STORAGE_KEY, String(value));
    } catch (e) {
      /* ignore storage errors */
    }
  }

  function randomFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * CELLS),
        y: Math.floor(Math.random() * CELLS),
      };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    return pos;
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    food = randomFood();
    score = 0;
    running = true;
    paused = false;
    best = loadBest();
    updateScore();
    overlay.style.display = 'none';
  }

  function updateScore() {
    scoreEl.textContent = `Score: ${score} | Best: ${best}`;
  }

  function endGame() {
    running = false;
    if (score > best) {
      best = score;
      saveBest(best);
    }
    overlayText.textContent = `Game Over — Score: ${score}`;
    overlay.style.display = 'flex';
    updateScore();
  }

  function tick() {
    if (!running || paused) return;

    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (
      head.x < 0 || head.x >= CELLS ||
      head.y < 0 || head.y >= CELLS ||
      snake.some(s => s.x === head.x && s.y === head.y)
    ) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      score += 10;
      food = randomFood();
    } else {
      snake.pop();
    }

    draw();
  }

  function draw() {
    ctx.fillStyle = '#1a2032';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#ff5a6e';
    ctx.fillRect(food.x * GRID + 1, food.y * GRID + 1, GRID - 2, GRID - 2);

    snake.forEach((seg, i) => {
      ctx.fillStyle = i === 0 ? '#7bd88f' : '#4a9dff';
      ctx.fillRect(seg.x * GRID + 1, seg.y * GRID + 1, GRID - 2, GRID - 2);
    });

    updateScore();
  }

  const KEY_MAP = {
    ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
    w: { x: 0, y: -1 }, s: { x: 0, y: 1 },
    a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
  };

  window.addEventListener('keydown', (e) => {
    if (e.key === ' ') {
      if (running) paused = !paused;
      e.preventDefault();
      return;
    }
    const wanted = KEY_MAP[e.key];
    if (!wanted) return;
    e.preventDefault();
    if (!running) return;
    if (wanted.x === -dir.x && wanted.y === -dir.y) return;
    nextDir = wanted;
  });

  restartBtn.addEventListener('click', reset);

  reset();
  draw();
  loopId = setInterval(tick, 110);
})();
</script>
</body>
</html>
