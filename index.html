<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Snake Game</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    color-scheme: dark;
    --bg: #0a0e18;
    --panel: #171e30;
    --panel-2: #1c2438;
    --board: #1a2032;
    --border: #323a56;
    --accent: #4a7bff;
    --accent-2: #8f6bff;
    --accent-hover: #3a63e0;
    --head: #8ef0a3;
    --food: #ff5a6e;
    --text: #eef0f6;
    --muted: #8892b0;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
  }
  body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    color: var(--text);
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif;
    padding: 24px 16px;
    -webkit-tap-highlight-color: transparent;
    touch-action: none;
    user-select: none;
    position: relative;
    overflow-x: hidden;
    background: var(--bg);
    isolation: isolate;
  }
  body::before, body::after {
    content: "";
    position: fixed;
    width: 55vmax;
    height: 55vmax;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.16;
    z-index: -1;
    pointer-events: none;
  }
  body::before {
    background: var(--accent);
    top: -20vmax;
    left: -15vmax;
  }
  body::after {
    background: var(--accent-2);
    bottom: -22vmax;
    right: -15vmax;
  }

  .card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    background: linear-gradient(180deg, var(--panel), var(--panel-2));
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 24px 28px 28px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.04);
    max-width: 100%;
  }

  .title {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 0;
  }
  .title .dot {
    width: 12px; height: 12px; border-radius: 50%;
    background: var(--head);
    box-shadow: 0 0 12px var(--head);
  }
  h1 {
    margin: 0;
    font-family: "Space Grotesk", "Inter", sans-serif;
    font-size: 1.7em;
    letter-spacing: 5px;
    font-weight: 700;
    background: linear-gradient(135deg, #eef0f6, #aebbf5);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .hud {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 8px;
    font-variant-numeric: tabular-nums;
  }
  .pill {
    background: rgba(255,255,255,0.03);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 6px 16px;
    font-size: 0.9em;
    display: flex;
    gap: 6px;
    align-items: baseline;
    white-space: nowrap;
  }
  .pill .label { color: var(--muted); font-size: 0.78em; letter-spacing: 0.5px; }
  .pill .value { font-weight: 700; font-family: "Space Grotesk", sans-serif; transition: transform 0.15s ease; }
  .pill .value.bump { transform: scale(1.35); color: var(--head); }
  button.pill {
    font: inherit;
    color: inherit;
    line-height: 1;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  button.pill:hover { border-color: var(--accent); background: rgba(74,123,255,0.1); }
  button.pill:active { transform: scale(0.94); }

  .board-wrap {
    position: relative;
    line-height: 0;
    border-radius: 14px;
  }
  canvas {
    background: var(--board);
    border: 2px solid var(--border);
    border-radius: 12px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.02), 0 0 40px rgba(80, 120, 255, 0.15), 0 15px 35px rgba(0,0,0,0.5);
    max-width: min(90vw, 420px);
    max-height: 60vh;
    width: 400px;
    height: 400px;
    display: block;
    aspect-ratio: 1 / 1;
  }

  #hint {
    font-size: 0.82em;
    color: var(--muted);
    text-align: center;
  }
  #hint kbd {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 7px;
    font-family: inherit;
    font-size: 0.95em;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    background: rgba(8, 10, 18, 0.88);
    backdrop-filter: blur(3px);
    gap: 14px;
    border-radius: 12px;
    opacity: 0;
    pointer-events: none;
    transform: scale(0.98);
    transition: opacity 0.2s ease, transform 0.2s ease;
    text-align: center;
    padding: 20px;
  }
  #overlay.show {
    opacity: 1;
    pointer-events: auto;
    transform: scale(1);
  }
  #overlayText {
    font-family: "Space Grotesk", sans-serif;
    font-size: 1.5em;
    font-weight: 700;
  }
  #overlaySub {
    color: var(--muted);
    font-size: 0.9em;
  }
  #overlay button {
    padding: 11px 32px;
    font-size: 1em;
    font-weight: 600;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: white;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    box-shadow: 0 8px 20px rgba(74,123,255,0.35);
    transition: transform 0.12s ease, box-shadow 0.15s ease;
  }
  #overlay button:hover { transform: translateY(-1px); box-shadow: 0 10px 24px rgba(74,123,255,0.45); }
  #overlay button:active { transform: scale(0.96); }

  .touch-controls {
    display: none;
    grid-template-columns: repeat(3, 58px);
    grid-template-rows: repeat(2, 58px);
    gap: 8px;
    margin-top: 4px;
  }
  .touch-controls button {
    background: rgba(255,255,255,0.04);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 12px;
    font-size: 1.4em;
    cursor: pointer;
    transition: background 0.1s ease, transform 0.1s ease;
  }
  .touch-controls button:active { background: var(--accent); transform: scale(0.92); }
  .tc-up { grid-column: 2; grid-row: 1; }
  .tc-left { grid-column: 1; grid-row: 2; }
  .tc-down { grid-column: 2; grid-row: 2; }
  .tc-right { grid-column: 3; grid-row: 2; }

  @media (hover: none) and (pointer: coarse) {
    .touch-controls { display: grid; }
    #hint { display: none; }
  }

  @media (max-width: 420px) {
    .card { padding: 18px 14px 22px; border-radius: 16px; }
    h1 { font-size: 1.4em; letter-spacing: 3px; }
  }

  @keyframes flash {
    0% { filter: brightness(2.2); }
    100% { filter: brightness(1); }
  }
  .flash { animation: flash 0.25s ease-out; }
</style>
</head>
<body>
  <div class="card">
    <div class="title">
      <span class="dot"></span>
      <h1>SNAKE</h1>
    </div>

    <div class="hud">
      <div class="pill"><span class="label">SCORE</span><span class="value" id="scoreVal">0</span></div>
      <div class="pill"><span class="label">BEST</span><span class="value" id="bestVal">0</span></div>
      <div class="pill"><span class="label">LVL</span><span class="value" id="levelVal">1</span></div>
      <button id="muteBtn" class="pill" style="cursor:pointer;">🔊</button>
    </div>

    <div class="board-wrap">
      <canvas id="game" width="400" height="400"></canvas>
      <div id="overlay" class="show">
        <div id="overlayText">Snake</div>
        <div id="overlaySub">Press any key or tap to start</div>
        <button id="restartBtn">Play</button>
      </div>
    </div>

    <div id="hint">
      <kbd>&larr;</kbd><kbd>&uarr;</kbd><kbd>&darr;</kbd><kbd>&rarr;</kbd> or <kbd>WASD</kbd> to move &middot; <kbd>Space</kbd> to pause
    </div>

    <div class="touch-controls">
      <button class="tc-up" data-dir="up">&uarr;</button>
      <button class="tc-left" data-dir="left">&larr;</button>
      <button class="tc-down" data-dir="down">&darr;</button>
      <button class="tc-right" data-dir="right">&rarr;</button>
    </div>
  </div>

<script>
(function () {
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const scoreVal = document.getElementById('scoreVal');
  const bestVal = document.getElementById('bestVal');
  const levelVal = document.getElementById('levelVal');
  const muteBtn = document.getElementById('muteBtn');
  const overlay = document.getElementById('overlay');
  const overlayText = document.getElementById('overlayText');
  const overlaySub = document.getElementById('overlaySub');
  const restartBtn = document.getElementById('restartBtn');

  const GRID = 20;
  const CELLS = canvas.width / GRID;
  const STORAGE_KEY = 'snake_best_score';
  const MUTE_KEY = 'snake_muted';
  const BASE_SPEED = 110;
  const MIN_SPEED = 55;

  let snake, dir, nextDir, food, score, best, running, paused, started;
  let loopId = null;
  let pulse = 0;
  let particles = [];
  let muted = false;
  try { muted = localStorage.getItem(MUTE_KEY) === '1'; } catch (e) { /* ignore */ }

  // --- Sound ---
  let audioCtx = null;
  function ensureAudio() {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    }
    return audioCtx;
  }
  function beep(freq, duration, type, gainPeak) {
    if (muted) return;
    const ac = ensureAudio();
    if (!ac) return;
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = type || 'sine';
    osc.frequency.value = freq;
    gain.gain.setValueAtTime(gainPeak || 0.15, ac.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + duration);
    osc.connect(gain);
    gain.connect(ac.destination);
    osc.start();
    osc.stop(ac.currentTime + duration);
  }
  const sfx = {
    eat: () => beep(660, 0.12, 'square', 0.12),
    turn: () => {},
    over: () => { beep(180, 0.35, 'sawtooth', 0.15); },
    start: () => beep(440, 0.1, 'sine', 0.1),
  };
  function updateMuteBtn() {
    muteBtn.textContent = muted ? '🔇' : '🔊';
  }
  muteBtn.addEventListener('click', () => {
    muted = !muted;
    try { localStorage.setItem(MUTE_KEY, muted ? '1' : '0'); } catch (e) { /* ignore */ }
    updateMuteBtn();
  });
  updateMuteBtn();

  // --- Particles ---
  function spawnParticles(cellX, cellY, color) {
    const cx = cellX * GRID + GRID / 2;
    const cy = cellY * GRID + GRID / 2;
    for (let i = 0; i < 14; i++) {
      const angle = (Math.PI * 2 * i) / 14 + Math.random() * 0.4;
      const speed = 1.2 + Math.random() * 1.8;
      particles.push({
        x: cx, y: cy,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        color,
      });
    }
  }
  function updateParticles() {
    particles = particles.filter(p => p.life > 0.02);
    particles.forEach(p => {
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= 0.94;
      p.vy *= 0.94;
      p.life *= 0.90;
    });
  }
  function drawParticles() {
    particles.forEach(p => {
      ctx.globalAlpha = p.life;
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.2, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
  }

  function loadBest() {
    try {
      return parseInt(localStorage.getItem(STORAGE_KEY) || '0', 10) || 0;
    } catch (e) {
      return 0;
    }
  }

  function saveBest(value) {
    try {
      localStorage.setItem(STORAGE_KEY, String(value));
    } catch (e) {
      /* ignore storage errors */
    }
  }

  function randomFood() {
    let pos;
    do {
      pos = {
        x: Math.floor(Math.random() * CELLS),
        y: Math.floor(Math.random() * CELLS),
      };
    } while (snake.some(s => s.x === pos.x && s.y === pos.y));
    return pos;
  }

  function bump(el) {
    el.classList.remove('bump');
    void el.offsetWidth;
    el.classList.add('bump');
  }

  function setScore(value) {
    score = value;
    scoreVal.textContent = score;
    bump(scoreVal);
    const level = Math.floor(score / 50) + 1;
    if (levelVal.textContent !== String(level)) {
      levelVal.textContent = level;
      bump(levelVal);
    }
  }

  function currentSpeed() {
    return Math.max(MIN_SPEED, BASE_SPEED - Math.floor(score / 50) * 6);
  }

  function scheduleLoop() {
    if (loopId) clearInterval(loopId);
    loopId = setInterval(tick, currentSpeed());
  }

  function reset() {
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = { x: 1, y: 0 };
    food = randomFood();
    best = loadBest();
    bestVal.textContent = best;
    setScore(0);
    levelVal.textContent = '1';
    particles = [];
    running = true;
    paused = false;
    started = true;
    overlay.classList.remove('show');
    scheduleLoop();
    draw();
    sfx.start();
  }

  function showOverlay(title, sub, buttonLabel) {
    overlayText.textContent = title;
    overlaySub.textContent = sub;
    restartBtn.textContent = buttonLabel;
    overlay.classList.add('show');
  }

  function endGame() {
    running = false;
    clearInterval(loopId);
    if (score > best) {
      best = score;
      saveBest(best);
      bestVal.textContent = best;
      showOverlay('New Best! 🎉', `Score: ${score}`, 'Play Again');
    } else {
      showOverlay('Game Over', `Score: ${score} · Best: ${best}`, 'Play Again');
    }
    canvas.classList.add('flash');
    setTimeout(() => canvas.classList.remove('flash'), 250);
    sfx.over();
  }

  function togglePause() {
    if (!running) return;
    paused = !paused;
    if (paused) {
      showOverlay('Paused', 'Press Space to resume', 'Resume');
    } else {
      overlay.classList.remove('show');
    }
  }

  function tick() {
    if (!running || paused) return;

    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

    if (
      head.x < 0 || head.x >= CELLS ||
      head.y < 0 || head.y >= CELLS ||
      snake.some(s => s.x === head.x && s.y === head.y)
    ) {
      endGame();
      return;
    }

    snake.unshift(head);

    if (head.x === food.x && head.y === food.y) {
      spawnParticles(food.x, food.y, '#ff5a6e');
      setScore(score + 10);
      food = randomFood();
      scheduleLoop();
      sfx.eat();
    } else {
      snake.pop();
    }

    draw();
  }

  function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  function drawGrid() {
    ctx.fillStyle = '#1a2032';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    ctx.strokeStyle = 'rgba(255,255,255,0.035)';
    ctx.lineWidth = 1;
    for (let i = 1; i < CELLS; i++) {
      ctx.beginPath();
      ctx.moveTo(i * GRID, 0);
      ctx.lineTo(i * GRID, canvas.height);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(0, i * GRID);
      ctx.lineTo(canvas.width, i * GRID);
      ctx.stroke();
    }
  }

  function drawFood() {
    const r = GRID / 2 - 1;
    const cx = food.x * GRID + GRID / 2;
    const cy = food.y * GRID + GRID / 2;
    const wobble = Math.sin(pulse) * 1.5;

    ctx.save();
    ctx.shadowColor = '#ff5a6e';
    ctx.shadowBlur = 12;
    ctx.fillStyle = '#ff5a6e';
    ctx.beginPath();
    ctx.arc(cx, cy, r + wobble, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();

    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.beginPath();
    ctx.arc(cx - r / 2.5, cy - r / 2.5, r / 3, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawSnake() {
    for (let i = snake.length - 1; i >= 0; i--) {
      const seg = snake[i];
      const t = snake.length > 1 ? i / (snake.length - 1) : 0;
      if (i === 0) {
        ctx.fillStyle = '#8ef0a3';
      } else {
        const r = Math.round(74 + (61 - 74) * t);
        const g = Math.round(157 + (127 - 157) * t);
        const b = Math.round(255 + (224 - 255) * t);
        ctx.fillStyle = `rgb(${r},${g},${b})`;
      }
      roundedRect(seg.x * GRID + 1.5, seg.y * GRID + 1.5, GRID - 3, GRID - 3, 5);
    }

    if (snake.length) {
      const head = snake[0];
      const cx = head.x * GRID + GRID / 2;
      const cy = head.y * GRID + GRID / 2;
      const ex = dir.x * 4;
      const ey = dir.y * 4;
      const px = dir.y * 3;
      const py = -dir.x * 3;
      ctx.fillStyle = '#0f1420';
      ctx.beginPath();
      ctx.arc(cx + ex + px, cy + ey + py, 1.6, 0, Math.PI * 2);
      ctx.arc(cx + ex - px, cy + ey - py, 1.6, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function draw() {
    drawGrid();
    drawFood();
    drawSnake();
    drawParticles();
  }

  function fullRedrawLoop() {
    pulse += 0.12;
    updateParticles();
    drawGrid();
    drawFood();
    drawSnake();
    drawParticles();
    requestAnimationFrame(fullRedrawLoop);
  }

  const KEY_MAP = {
    ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 },
    ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 },
    w: { x: 0, y: -1 }, s: { x: 0, y: 1 },
    a: { x: -1, y: 0 }, d: { x: 1, y: 0 },
  };
  const NAMED_DIR = {
    up: { x: 0, y: -1 }, down: { x: 0, y: 1 },
    left: { x: -1, y: 0 }, right: { x: 1, y: 0 },
  };

  function applyDirection(wanted) {
    if (!wanted || !started || !running) return;
    if (wanted.x === -dir.x && wanted.y === -dir.y) return;
    nextDir = wanted;
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === ' ') {
      e.preventDefault();
      if (!started) { reset(); return; }
      togglePause();
      return;
    }
    if (!started) {
      reset();
      return;
    }
    const wanted = KEY_MAP[e.key];
    if (!wanted) return;
    e.preventDefault();
    applyDirection(wanted);
  });

  document.querySelectorAll('.touch-controls button').forEach(btn => {
    btn.addEventListener('click', () => {
      if (!started) { reset(); return; }
      applyDirection(NAMED_DIR[btn.dataset.dir]);
    });
  });

  // Swipe support
  let touchStart = null;
  canvas.addEventListener('touchstart', (e) => {
    touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
  }, { passive: true });
  canvas.addEventListener('touchend', (e) => {
    if (!touchStart) return;
    if (!started) { reset(); return; }
    const dx = e.changedTouches[0].clientX - touchStart.x;
    const dy = e.changedTouches[0].clientY - touchStart.y;
    if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
    if (Math.abs(dx) > Math.abs(dy)) {
      applyDirection(dx > 0 ? NAMED_DIR.right : NAMED_DIR.left);
    } else {
      applyDirection(dy > 0 ? NAMED_DIR.down : NAMED_DIR.up);
    }
    touchStart = null;
  }, { passive: true });

  restartBtn.addEventListener('click', () => reset());

  started = false;
  running = false;
  paused = false;
  snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
  dir = { x: 1, y: 0 };
  food = randomFood();
  best = loadBest();
  bestVal.textContent = best;
  scoreVal.textContent = '0';
  draw();
  requestAnimationFrame(fullRedrawLoop);
})();
</script>
</body>
</html>
